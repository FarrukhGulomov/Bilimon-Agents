<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BilimOn Agents</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #1c1c1e;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #555; margin-top: 0; margin-bottom: 24px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 18px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #9ab4ea; cursor: not-allowed; }
  #status { margin-top: 18px; font-size: 0.95rem; white-space: pre-wrap; }
  #status.error { color: #b91c1c; }
  #status.success { color: #15803d; }
  #download {
    display: none;
    margin-top: 14px;
    background: #15803d;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #ffffff88;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>BilimOn Agents</h1>
  <p class="subtitle">O'quv markazlarini qidirish uchun soha va sonini kiriting.</p>
  <div class="card">
    <form id="run-form">
      <label for="brief">Soha / talab</label>
      <input type="text" id="brief" name="brief" placeholder="masalan: ingliz tili bo'yicha yoki IT sohasi" maxlength="300" />

      <label for="count">Nechta o'quv markaz</label>
      <input type="number" id="count" name="count" value="5" min="1" max="50" />

      <button type="submit" id="submit-btn">Qidirishni boshlash</button>
    </form>
    <div id="status"></div>
    <button id="download" type="button">JSON yuklab olish</button>
  </div>
</main>

<script>
  const form = document.getElementById("run-form");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");
  const downloadBtn = document.getElementById("download");

  downloadBtn.addEventListener("click", () => {
    window.location.href = "/api/download";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const brief = document.getElementById("brief").value.trim();
    const count = Number(document.getElementById("count").value);

    statusEl.className = "";
    statusEl.textContent = "";
    downloadBtn.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Qidirilmoqda... (bir necha daqiqa vaqt olishi mumkin)';

    try {
      const res = await fetch("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ brief: brief || undefined, count }),
      });
      const data = await res.json();

      if (!res.ok) {
        statusEl.className = "error";
        statusEl.textContent = data.error || "Xatolik yuz berdi.";
        return;
      }

      if (data.warning) {
        statusEl.className = "error";
        statusEl.textContent = data.warning;
      } else {
        const s = data.summary;
        statusEl.className = "success";
        statusEl.textContent =
          `Tayyor: ${s.approved} tasdiqlandi, ${s.needsReview} ko'rib chiqish kerak, ` +
          `${s.rejected} rad etildi (jami ${s.processed} ta, ${s.duplicates} dublikat).`;
      }

      if (data.downloadUrl) {
        downloadBtn.style.display = "block";
      }
    } catch (err) {
      statusEl.className = "error";
      statusEl.textContent = "Server bilan bog'lanib bo'lmadi: " + err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Qidirishni boshlash";
    }
  });
</script>
</body>
</html>
